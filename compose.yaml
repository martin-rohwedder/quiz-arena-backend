services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: quiz-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-quiz_arena}
      POSTGRES_USER: ${DB_USERNAME:-quiz_arena}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
